[book]
title = "yo! — private messages from your terminal"
authors = ["yo! contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/jsprada/yo"
edit-url-template = "https://github.com/jsprada/yo/edit/main/docs/{path}"

[output.html.search]
enable = true
