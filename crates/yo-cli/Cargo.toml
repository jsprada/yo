[package]
name = "yo-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
getrandom = "0.4.3"
interprocess = { version = "2.4.7", features = ["tokio"] }
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
postcard = { version = "1.1.3", features = ["use-std"] }
qrcode = "0.14.1"
rpassword = "7.5.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
yo-crypto = { version = "0.1.0", path = "../yo-crypto" }
yo-proto = { version = "0.1.0", path = "../yo-proto" }
yo-store = { version = "0.1.0", path = "../yo-store" }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
yo-server = { path = "../yo-server" }

[lib]
name = "yo_cli"
path = "src/lib.rs"

[[bin]]
name = "yo"
path = "src/main.rs"
