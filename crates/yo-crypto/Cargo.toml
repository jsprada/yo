[package]
name = "yo-crypto"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
data-encoding = "2.11.1"
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
spake2 = "0.4.0"
thiserror = "2.0.21"
vodozemac = "0.11.1"
yo-proto = { version = "0.1.0", path = "../yo-proto" }
zeroize = "1.9.1"
