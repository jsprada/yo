[package]
name = "yo-store"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
yo-crypto = { version = "0.1.0", path = "../yo-crypto" }
yo-proto = { version = "0.1.0", path = "../yo-proto" }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
