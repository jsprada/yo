[package]
name = "yo-proto"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
data-encoding = "2.11.1"
futures-util = { version = "0.3.34", features = ["sink"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
webpki-roots = "1.0.11"
x509-parser = "0.18.1"
