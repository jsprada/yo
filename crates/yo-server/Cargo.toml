[package]
name = "yo-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
getrandom = "0.4.3"
postcard = { version = "1.1.3", features = ["use-std"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
yo-crypto = { version = "0.1.0", path = "../yo-crypto" }
yo-proto = { version = "0.1.0", path = "../yo-proto" }

[dev-dependencies]
tempfile = "3.27.0"
